<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="LawMind 律师本机工作台 — 下载桌面版安装包。合同审查、改稿签批与可交付文书。"
    />
    <title>下载桌面版 · LawMind</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1a1d24;
        --brass: #8a7348;
        --brass-soft: rgba(183, 154, 103, 0.16);
        --bg: #f3f1ec;
        --bg-accent: #e8eef4;
        --card: #fffcf7;
        --text: #1a1d24;
        --muted: #5a5e68;
        --accent: #1e5a8a;
        --accent-hover: #174a72;
        --accent-soft: rgba(30, 90, 138, 0.1);
        --border: #d4d0c8;
        --rec: #0d6b4d;
        --rec-bg: #e4f3ec;
        --danger: #9b2c2c;
        --font-sans: "Instrument Sans", "PingFang SC", "Noto Sans SC", sans-serif;
        --font-display: "Source Serif 4", "Songti SC", "Noto Serif SC", serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12141a;
          --bg-accent: #1a2430;
          --card: #1a1d24;
          --text: #f0efe9;
          --muted: #a4a8b0;
          --accent: #6eb3e8;
          --accent-hover: #8fc4ee;
          --accent-soft: rgba(110, 179, 232, 0.12);
          --border: #2e3340;
          --rec: #5ed4a8;
          --rec-bg: #12261f;
          --brass: #b79a67;
          --brass-soft: rgba(183, 154, 103, 0.14);
          --danger: #f0a8a8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-sans);
        color: var(--text);
        line-height: 1.55;
        background:
          radial-gradient(ellipse 80% 50% at 10% -10%, var(--brass-soft), transparent 55%),
          radial-gradient(ellipse 70% 45% at 100% 0%, var(--accent-soft), transparent 50%),
          linear-gradient(180deg, var(--bg-accent) 0%, var(--bg) 42%, var(--bg) 100%);
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 2.25rem 1.25rem 3.5rem;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 0.65rem;
        margin-bottom: 1.75rem;
      }
      .brand-mark {
        font-family: var(--font-display);
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(120deg, var(--ink) 25%, var(--accent) 65%, var(--brass));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        .brand-mark {
          background: linear-gradient(120deg, #f0efe9 20%, var(--accent) 55%, var(--brass));
          -webkit-background-clip: text;
          background-clip: text;
        }
      }
      .brand-tag {
        font-size: 0.82rem;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      h1 {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 3.5vw, 2.15rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin: 0 0 0.55rem;
      }
      .sub {
        color: var(--muted);
        font-size: 1.02rem;
        max-width: 36em;
        margin: 0 0 1.5rem;
      }
      .banner {
        background: var(--accent-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.85rem 1rem;
        margin-bottom: 1.15rem;
        font-size: 0.9rem;
      }
      .banner strong {
        color: var(--text);
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 1.5rem;
        box-shadow: 0 1px 0 rgba(26, 29, 36, 0.04);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      th,
      td {
        padding: 0.7rem 0.9rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        background: rgba(26, 29, 36, 0.03);
        font-weight: 600;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      @media (prefers-color-scheme: dark) {
        th {
          background: rgba(255, 255, 255, 0.03);
        }
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr.rec td {
        background: var(--rec-bg);
      }
      tr.rec td:first-child::before {
        content: "推荐 · ";
        color: var(--rec);
        font-weight: 600;
      }
      a.btn {
        display: inline-block;
        padding: 0.4rem 0.75rem;
        border-radius: 7px;
        background: var(--accent);
        color: #fff !important;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.82rem;
      }
      a.btn:hover {
        background: var(--accent-hover);
      }
      .muted {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .err {
        color: var(--danger);
        padding: 1rem;
        font-size: 0.9rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin: 0 0 1.75rem;
        font-size: 0.92rem;
      }
      .links a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .links a:hover {
        text-decoration: underline;
      }
      footer {
        font-size: 0.8rem;
        color: var(--muted);
        border-top: 1px solid var(--border);
        padding-top: 1.25rem;
      }
      footer a {
        color: var(--accent);
      }
      code {
        font-size: 0.85em;
        background: rgba(26, 29, 36, 0.06);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      @media (prefers-color-scheme: dark) {
        code {
          background: rgba(255, 255, 255, 0.08);
        }
      }
      @media (max-width: 640px) {
        table {
          font-size: 0.8rem;
        }
        th:nth-child(2),
        td:nth-child(2) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="brand" aria-label="LawMind">
        <span class="brand-mark">LawMind</span>
        <span class="brand-tag">律师本机工作台</span>
      </header>

      <h1>下载桌面版</h1>
      <p class="sub">
        按当前环境推荐安装包。材料与审计留在本机；安装后即可走审查 → 改稿 → 签批 → 导出。
      </p>

      <nav class="links" aria-label="相关说明">
        <a href="https://docs.lawmind.ai/LAWMIND-USER-MANUAL">使用手册</a>
        <a href="https://docs.lawmind.ai/LAWMIND-DATA-PROCESSING">数据处理</a>
        <a href="https://docs.lawmind.ai/LAWMIND-DELIVERY">客户交付</a>
        <a
          href="https://github.com/lawmind/lawmind/blob/main/apps/lawmind-desktop/INSTALL.md"
          rel="noopener"
          target="_blank"
          >安装说明</a
        >
      </nav>

      <div class="banner" id="detect-banner" hidden>
        检测到：<strong id="detect-label">—</strong>。若与本机不符，请改选对应系统的安装包。
      </div>

      <div class="panel" role="region" aria-label="安装包列表">
        <div id="status" class="muted" style="padding: 0.85rem 1rem">正在读取发布信息…</div>
        <div id="table-wrap" hidden>
          <table>
            <thead>
              <tr>
                <th>说明</th>
                <th>文件名</th>
                <th>大小</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="error" class="err" hidden></div>
      </div>

      <footer>
        <p>
          正式域名：
          <a href="https://docs.lawmind.ai/download/">docs.lawmind.ai/download</a>
          。企业私有构建可用
          <code>?repo=组织/仓库</code>
          指向自有 GitHub Release；亦可将本页托管到内网。
        </p>
        <p>输出须经执业律师审阅后方可对外。LawMind 不构成法律意见。</p>
      </footer>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var repo = params.get("repo") || "lawmind/lawmind";
        var api = "https://api.github.com/repos/" + repo + "/releases/latest";

        function formatBytes(n) {
          if (typeof n !== "number" || !Number.isFinite(n)) return "—";
          if (n < 1024) return n + " B";
          if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
          return (n / (1024 * 1024)).toFixed(1) + " MB";
        }

        function detectClient() {
          var ua = navigator.userAgent || "";
          var platform =
            (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
          var os = "unknown";
          var arch = "x64";
          if (/Win/i.test(platform) || /Windows/i.test(ua)) os = "win";
          else if (/Mac/i.test(platform) || /Mac OS X/i.test(ua)) os = "mac";
          else if (/Linux/i.test(platform) || /Linux/i.test(ua)) os = "linux";
          var arm =
            /aarch64|arm64|armv8/i.test(ua) ||
            (navigator.userAgentData && navigator.userAgentData.arch === "arm");
          if (arm) arch = "arm64";
          if (os === "win" && /arm/i.test(ua)) arch = "arm64";
          return { os: os, arch: arch, label: os + " · " + arch };
        }

        function classifyAsset(name) {
          var lower = name.toLowerCase();
          if (!/^lawmind/i.test(name) && !/lawmind/i.test(lower)) {
            return null;
          }
          var row = { raw: name, kind: "", sort: 50 };
          if (lower.endsWith(".dmg")) {
            row.kind = "macOS 磁盘映像（拖拽安装）";
            row.os = "mac";
            row.sort = 12;
            return row;
          }
          if (lower.endsWith(".appimage")) {
            row.kind = "Linux AppImage";
            row.os = "linux";
            row.sort = 42;
            return row;
          }
          if (lower.endsWith(".tar.gz") || lower.endsWith(".tgz")) {
            row.kind = "Linux 解压即用（tar.gz）";
            row.os = "linux";
            row.sort = 43;
            return row;
          }
          if (lower.endsWith(".zip")) {
            row.kind =
              lower.indexOf("win") >= 0 || lower.indexOf("windows") >= 0
                ? "Windows 压缩包（解压运行）"
                : "压缩包（请看清 mac / win）";
            row.os =
              lower.indexOf("win") >= 0
                ? "win"
                : lower.indexOf("mac") >= 0 || lower.indexOf("darwin") >= 0
                  ? "mac"
                  : null;
            row.sort = row.os === "win" ? 22 : row.os === "mac" ? 11 : 30;
            return row;
          }
          if (lower.endsWith(".exe")) {
            if (lower.indexOf("portable") >= 0) {
              row.kind = "Windows 绿色版（portable）";
              row.os = "win";
              row.sort = 21;
              return row;
            }
            row.kind = "Windows 安装程序";
            row.os = "win";
            row.sort = 20;
            return row;
          }
          return { raw: name, kind: "其他", os: null, sort: 99 };
        }

        function archFromName(name) {
          var lower = name.toLowerCase();
          if (lower.indexOf("arm64") >= 0 || lower.indexOf("aarch64") >= 0) return "arm64";
          if (
            lower.indexOf("x64") >= 0 ||
            lower.indexOf("x86_64") >= 0 ||
            lower.indexOf("win32-x64") >= 0
          )
            return "x64";
          return null;
        }

        function scoreForClient(row, client) {
          if (!row || !row.os || row.os === "unknown") return 0;
          if (row.os !== client.os) return 0;
          var a = archFromName(row.raw);
          if (!a) return 50;
          if (a === client.arch) return 100;
          if (client.os === "mac" && a === "x64" && client.arch === "arm64") return 40;
          return 20;
        }

        var client = detectClient();
        var banner = document.getElementById("detect-banner");
        var detectLabel = document.getElementById("detect-label");
        if (client.os !== "unknown") {
          banner.hidden = false;
          detectLabel.textContent = client.label;
        }

        fetch(api, { headers: { Accept: "application/vnd.github+json" } })
          .then(function (r) {
            if (!r.ok) throw new Error("GitHub API: HTTP " + r.status);
            return r.json();
          })
          .then(function (data) {
            document.getElementById("status").textContent =
              "最新版本：" + (data.tag_name || "—") + "（" + repo + "）";
            var assets = Array.isArray(data.assets) ? data.assets : [];
            var rows = [];
            for (var i = 0; i < assets.length; i++) {
              var a = assets[i];
              var info = classifyAsset(a.name || "");
              if (!info) continue;
              info.url = a.browser_download_url;
              info.size = a.size;
              rows.push(info);
            }
            rows.sort(function (x, y) {
              return x.sort - y.sort || x.raw.localeCompare(y.raw);
            });
            if (rows.length === 0) {
              document.getElementById("error").hidden = false;
              document.getElementById("error").textContent =
                "最新 Release 中未找到 LawMind 安装包。请确认已上传构建产物，或检查 ?repo= 参数。";
              return;
            }
            var bestIdx = -1;
            var bestScore = -1;
            for (var j = 0; j < rows.length; j++) {
              var sc = scoreForClient(rows[j], client);
              if (sc > bestScore) {
                bestScore = sc;
                bestIdx = j;
              }
            }
            var tbody = document.getElementById("rows");
            tbody.innerHTML = "";
            for (var k = 0; k < rows.length; k++) {
              var row = rows[k];
              var tr = document.createElement("tr");
              if (k === bestIdx && bestScore >= 40) tr.className = "rec";
              var td1 = document.createElement("td");
              td1.textContent = row.kind;
              var td2 = document.createElement("td");
              td2.textContent = row.raw;
              var td3 = document.createElement("td");
              td3.textContent = formatBytes(row.size);
              var td4 = document.createElement("td");
              var link = document.createElement("a");
              link.className = "btn";
              link.href = row.url;
              link.rel = "noopener";
              link.textContent = "下载";
              td4.appendChild(link);
              tr.appendChild(td1);
              tr.appendChild(td2);
              tr.appendChild(td3);
              tr.appendChild(td4);
              tbody.appendChild(tr);
            }
            document.getElementById("table-wrap").hidden = false;
          })
          .catch(function (e) {
            document.getElementById("status").textContent = "";
            var err = document.getElementById("error");
            err.hidden = false;
            err.textContent =
              "无法加载发布信息（" +
              (e && e.message ? e.message : String(e)) +
              "）。私有仓库请使用可访问的分发渠道，或将本页与镜像托管至内网。";
          });
      })();
    </script>
  </body>
</html>
