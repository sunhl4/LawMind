# Dependency audit + LawMind SBOM fingerprint. Gates merges on high-severity findings.
name: LawMind security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/lawmind-desktop/package.json"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  lawmind-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high+ blocks merge)
        run: pnpm audit --audit-level=high

      - name: LawMind SBOM (fingerprint + CycloneDX)
        run: pnpm lawmind:sbom
