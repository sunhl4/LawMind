# Core LawMind checks: unit tests, desktop server bundle, renderer typecheck, HTTP smoke.
name: LawMind CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lawmind-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generated artifact (gitignored). `dev` and `build:renderer` produce it,
      # but this job runs `pnpm test` directly — without it every canvas-importing
      # renderer test and the e2e webserver fail on
      # `Failed to resolve import "./sandbox-runtime.js?raw"`.
      - name: Build canvas sandbox runtime
        run: node apps/lawmind-desktop/scripts/build-canvas-sandbox.mjs

      - name: Test with coverage (one pass)
        run: pnpm test:coverage

      - name: Coverage ratchet
        run: pnpm test:coverage:ratchet

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          # 每次约 6.5MB；默认 90 天会把账号配额吃满（免费 500MB），
          # 配额一满，同账号下 docs 的 upload-pages-artifact 会直接失败。
          retention-days: 5
        # 账号级 Actions 存储配额耗尽时（"Artifact storage quota has been hit"，
        # 用量每 6–12 小时才重算一次），这里报错会让**整份 verify 变红**，
        # 但代码检查本身早已全部通过。诊断产物属于附加信息，不该当门禁。
        continue-on-error: true

      - name: Skills golden smoke (G0)
        run: pnpm lawmind:skills:golden -- --compare

      - name: Upload skills golden compare report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skills-golden-compare
          path: docs/generated/skills-golden-compare-report.json
          if-no-files-found: ignore
          retention-days: 5
        # 同 coverage：配额耗尽不该把已通过的代码检查判红。
        continue-on-error: true

      - name: Typecheck LawMind engine
        run: pnpm typecheck

      - name: Bundle local API (esbuild)
        run: pnpm lawmind:bundle:desktop-server

      - name: Typecheck LawMind desktop renderer
        run: pnpm --filter lawmind-desktop typecheck

      - name: Typecheck desktop server + electron (node-side)
        run: pnpm typecheck:desktop-node

      - name: Renderer CSS sync markers and size gate
        run: pnpm lawmind:check:renderer-css

      - name: Renderer styles.css matches its source modules
        run: pnpm lawmind:check:renderer-css-sync

      - name: "Renderer must not pull node builtins"
        run: pnpm lawmind:check:renderer-node

      # 律师可见文案：硬拦档命中即失败；近义词棘轮档新增即失败（地板见
      # scripts/lawmind/ui-copy-lint-synonym-baseline.json，只许下降）。
      - name: "Lawyer-facing copy: banned terms + synonym ratchet"
        run: pnpm lawmind:ui-copy-lint

      - name: Engine tests must not stub global fetch
        run: pnpm lawmind:check:no-global-fetch-stub

      - name: Platform contracts
        run: pnpm lawmind:check:platform-contracts

      - name: Desktop HTTP smoke
        run: pnpm lawmind:desktop:http-smoke

      - name: Release readiness report
        run: pnpm lawmind:release-readiness -- --out dist/lawmind-release-readiness.md

      - name: Upload release readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-report
          path: dist/lawmind-release-readiness.md
          if-no-files-found: warn
          retention-days: 5
        # 同 coverage：配额耗尽不该把已通过的代码检查判红。
        continue-on-error: true

  file-size-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check file size soft limits
        run: node scripts/pre-commit/check-file-size.mjs

  desktop-e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Vite resolves `./sandbox-runtime.js?raw` at dev-server start; the file is
      # generated and gitignored, so the e2e webserver needs it built first.
      - name: Build canvas sandbox runtime
        run: node apps/lawmind-desktop/scripts/build-canvas-sandbox.mjs

      - name: Install Playwright Chromium
        run: pnpm --filter lawmind-desktop exec playwright install chromium --with-deps

      - name: Desktop E2E (mock API + Vite)
        run: pnpm lawmind:desktop:e2e:pr
