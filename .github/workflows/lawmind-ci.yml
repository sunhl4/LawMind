# Core LawMind checks: unit tests, desktop server bundle, renderer typecheck, HTTP smoke.
name: LawMind CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lawmind-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test (LawMind + desktop packages)
        run: pnpm test

      - name: Typecheck LawMind engine
        run: pnpm typecheck

      - name: Bundle local API (esbuild)
        run: pnpm lawmind:bundle:desktop-server

      - name: Typecheck LawMind desktop renderer
        run: pnpm --filter lawmind-desktop typecheck

      - name: Desktop HTTP smoke
        run: pnpm lawmind:desktop:http-smoke

      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Release readiness report
        run: pnpm lawmind:release-readiness -- --out dist/lawmind-release-readiness.md

      - name: Upload release readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: dist/lawmind-release-readiness.md
          if-no-files-found: warn

  file-size-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check file size soft limits
        run: node scripts/pre-commit/check-file-size.mjs

  desktop-e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter lawmind-desktop exec playwright install chromium --with-deps

      - name: Desktop E2E (mock API + Vite)
        run: pnpm lawmind:desktop:e2e:pr

  multitask-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Multitask validate (non-strict)
        run: pnpm lawmind:multitask:validate

      - name: Upload multitask report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multitask-validation-report
          path: dist/lawmind/multitask-validation/
          if-no-files-found: ignore
