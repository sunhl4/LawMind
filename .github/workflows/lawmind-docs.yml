# Verify LawMind VitePress site builds, and publish it to GitHub Pages on main.
name: LawMind docs

on:
  pull_request:
    paths:
      - "apps/lawmind-docs/**"
      - "docs/LAWMIND-*.md"
      - "docs/lawmind/**"
      - "docs/CNAME"
      - "apps/lawmind-desktop/download/**"
      - "pnpm-lock.yaml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "apps/lawmind-docs/**"
      - "docs/LAWMIND-*.md"
      - "docs/lawmind/**"
      - "docs/CNAME"
      - "apps/lawmind-desktop/download/**"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

# Pages 发布开关。
#
# 私有仓库 + 免费计划没有 GitHub Pages（`GET /repos/{owner}/{repo}/pages` 返回 404，
# `has_pages: false`），而 `upload-pages-artifact` 会先建 artifact；账号级 Actions
# 存储配额一旦被历史打包产物吃满，它就直接报
# "Failed to CreateArtifact: Artifact storage quota has been hit"，
# 把**本来只是想验证文档能构建**的 workflow 判红。
#
# 所以：构建与静态校验永远是门禁；**发布**只在显式打开开关时执行。
# 启用 Pages（公开仓库或付费计划 + Settings → Pages → Source: GitHub Actions）后，
# 设置仓库变量 `LAWMIND_PAGES_ENABLED=true` 即可恢复发布。
env:
  LAWMIND_PAGES_ENABLED: ${{ vars.LAWMIND_PAGES_ENABLED }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build LawMind docs
        run: pnpm lawmind:docs:build

      - name: Sanity — CNAME and .nojekyll must exist in the publish root
        run: |
          set -euo pipefail
          dist=apps/lawmind-docs/docs/.vitepress/dist
          test -f "${dist}/index.html" || { echo "::error::docs build produced no index.html"; exit 1; }
          test -f "${dist}/.nojekyll" || { echo "::error::missing .nojekyll (Pages would run Jekyll)"; exit 1; }
          if [ -f docs/CNAME ]; then
            test -f "${dist}/CNAME" || { echo "::error::missing CNAME in publish root"; exit 1; }
            echo "CNAME: $(cat "${dist}/CNAME")"
          fi
          echo "dist entries: $(find "${dist}" -maxdepth 1 | wc -l)"

      - name: Upload Pages artifact
        if: env.LAWMIND_PAGES_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/lawmind-docs/docs/.vitepress/dist

  deploy:
    needs: build
    if: env.LAWMIND_PAGES_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: lawmind-docs-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
