# Playwright smoke (mock API + Vite) and Electron golden path.
#
# Electron 只在「会改变桌面端真实运行态」的 PR 上跑（path 过滤），其余 PR 不背
# 这 ~2.3 分钟；每周一仍全量跑一次兜底，也可手动 dispatch。引擎侧改动由
# `lawmind-ci.yml` 的渲染层 PR 门禁 + 全量单测覆盖。
name: LawMind desktop E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/lawmind-desktop/**"
      - "scripts/lawmind/lawmind-bundle-desktop-server.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/lawmind-desktop-e2e.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lawmind-desktop-e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter lawmind-desktop exec playwright install chromium --with-deps

      - name: E2E smoke (mock API)
        run: pnpm lawmind:desktop:e2e

  lawmind-desktop-e2e-electron:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter lawmind-desktop exec playwright install chromium --with-deps

      - name: Bundle server and build renderer
        run: pnpm lawmind:bundle:desktop-server && pnpm --filter lawmind-desktop build:renderer

      # `setup-xvfb` 的契约是「把命令交给它跑」：少了 `with.run` 会直接
      # `##[error]Input required and not supplied: run` 并在 44s 内失败 ——
      # 一条真机用例都没跑，却让 PR 上显示「真机 e2e 红」。把命令挪进这一步。
      - name: Electron golden path
        id: electron_e2e
        continue-on-error: true
        uses: coactions/setup-xvfb@v1
        with:
          run: pnpm --filter lawmind-desktop test:e2e:electron

      # 真机红必须留下可诊断的现场：Playwright 的 trace/error-context、以及
      # `lawmind/daemon.log`。2026-09-23 第一次真跑时只有一行「Test timeout」，
      # 没有任何工件，无法判断卡在关窗还是后台启动 —— 那正是这条要解决的问题。
      - name: Upload E2E diagnostics
        if: steps.electron_e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lawmind-desktop-e2e-electron-diagnostics
          path: |
            apps/lawmind-desktop/test-results/**
            apps/lawmind-desktop/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14

      # 工件与结论分开：先留现场，再按真实结果失败（不把失败吞掉）。
      - name: Fail if Electron E2E failed
        if: steps.electron_e2e.outcome == 'failure'
        run: exit 1
