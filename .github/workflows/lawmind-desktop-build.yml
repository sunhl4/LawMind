# Build LawMind Desktop installable artifacts per OS (Electron + bundled Node + OfficeCLI + local API).
# Run manually or on tag push lawmind-desktop-v* to attach consistent release binaries.
name: LawMind desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "lawmind-desktop-v*"

permissions:
  contents: write

concurrency:
  group: lawmind-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
          - os: windows-latest
            label: win
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        env:
          OS_LABEL: ${{ matrix.label }}
          # macOS: 配了 Developer ID 的 tag 构建才要求公证。没有证书时打 adhoc 包。
          CSC_LINK: ${{ matrix.label == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.label == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Authenticode（缺证书时 electron-builder 会跳过签名并在报告中如实标红）。
          WIN_CSC_LINK: ${{ matrix.label == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.label == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          LAWMIND_REQUIRE_NOTARIZED: ${{ startsWith(github.ref, 'refs/tags/lawmind-desktop-v') && matrix.label == 'mac' && secrets.MAC_CSC_LINK != '' && '1' || '0' }}
          LAWMIND_DESKTOP_NODE_VERSION: "22.23.2"
        run: |
          if [ "$OS_LABEL" = "win" ] && [ -n "${WIN_CSC_LINK}" ]; then
            export CSC_LINK="${WIN_CSC_LINK}"
            export CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD}"
          fi
          if [ -z "${CSC_LINK}" ]; then
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # macOS 一次出 arm64 + x64 两个 .app（Intel Mac 的律师也能装）：
          # 单次 electron-builder 调用才会生成同时列出两种架构的 latest-mac.yml。
          if [ "$OS_LABEL" = "mac" ]; then
            pnpm --filter lawmind-desktop run dist:electron:mac:both
          else
            pnpm lawmind:desktop:dist
          fi
        shell: bash

      - name: Verify packaged mac architectures
        if: matrix.label == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          expect_arch() {
            dir="$1"; want_lipo="$2"; want_runtime="$3"
            app="apps/lawmind-desktop/release/$dir/LawMind.app"
            if [ ! -d "$app" ]; then
              echo "::error::missing $app — the $dir package did not build"
              exit 1
            fi
            got="$(lipo -archs "$app/Contents/MacOS/LawMind")"
            echo "$dir → $got"
            if [ "$got" != "$want_lipo" ]; then
              echo "::error::$dir/LawMind.app is '$got', expected '$want_lipo'"
              exit 1
            fi
            runtime="$app/Contents/Resources/node-runtime/darwin-$want_runtime/bin/node"
            if [ ! -x "$runtime" ]; then
              echo "::error::$dir is missing its bundled Node runtime ($runtime)"
              exit 1
            fi
            # 每个 app 只能带自己架构的运行时（extraResources 的 ${platform}-${arch} 宏）
            extra="$(ls "$app/Contents/Resources/node-runtime" | grep -v "^darwin-$want_runtime$" || true)"
            if [ -n "$extra" ]; then
              echo "::error::$dir carries a foreign runtime: $extra"
              exit 1
            fi
          }
          # 注意：electron-builder 给 x64 用的 appOutDir 是 `mac`（不是 mac-x64），
          # 只有 dmg/zip 文件名里才出现 -mac-x64。
          expect_arch mac-arm64 arm64 arm64
          expect_arch mac x86_64 x64
          echo "--- latest-mac.yml ---"
          cat apps/lawmind-desktop/release/latest-mac.yml

      - name: Packaging trust report
        if: always()
        run: node --import tsx scripts/lawmind/lawmind-release-readiness.ts --out dist/lawmind-release-readiness.md || true
        shell: bash

      - name: Upload packaging trust report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lawmind-packaging-report-${{ matrix.label }}
          path: dist/lawmind-release-readiness.md
          if-no-files-found: warn

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lawmind-desktop-${{ matrix.label }}
          path: apps/lawmind-desktop/release/*
          if-no-files-found: error
          # 安装包动辄数百 MB（mac 643MB / linux 494MB）。这三份产物是**构建结果**，
          # 真源是源码 + tag；留 3 天够排查一次发布事故，再长就会把账号的
          # Actions 存储配额（免费 500MB）吃光 —— 2026-10-24 正是这么让 docs 的
          # `upload-pages-artifact` 报 "Artifact storage quota has been hit"。
          retention-days: 3

  release:
    needs: package
    if: always() && startsWith(github.ref, 'refs/tags/lawmind-desktop-v') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          pattern: lawmind-desktop-*

      - name: Gate — require the auto-update manifests before publishing
        run: |
          set -euo pipefail
          found="$(find dist-artifacts -type f -name 'latest*.yml' | wc -l | tr -d ' ')"
          if [ "${found}" -eq 0 ]; then
            echo "::error::No latest*.yml in the packaged artifacts — clients could not auto-update."
            find dist-artifacts -type f | head -50
            exit 1
          fi
          echo "Found ${found} auto-update manifest(s)."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \
            -o -name '*.tar.gz' -o -name 'latest*.yml' -o -name '*.blockmap' \
          \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer assets found"
            find dist-artifacts -type f | head -100
            exit 1
          fi
          printf 'Attaching %s files\n' "${#files[@]}"
          version="${GITHUB_REF_NAME#lawmind-desktop-}"
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LawMind Desktop ${version}" \
            --notes "$(cat <<EOF
          LawMind 桌面安装包 ${version}。

          - macOS：已用 Developer ID 签名并公证的包可直接双击；未公证的测试包请右键应用选择「打开」。
          - 安装后按向导填写本机模型 API Key。
          - 输出须经执业律师审阅，不构成法律意见。
          EOF
          )"
