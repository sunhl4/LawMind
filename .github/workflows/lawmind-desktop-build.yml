# Build LawMind Desktop installable artifacts per OS (Electron + bundled Node + local API).
# Run manually or on tag push lawmind-desktop-v* to attach consistent release binaries.
name: LawMind desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "lawmind-desktop-v*"

permissions:
  contents: write

concurrency:
  group: lawmind-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
          - os: windows-latest
            label: win
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LAWMIND_DESKTOP_NODE_VERSION: "22.23.2"
        run: pnpm lawmind:desktop:dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lawmind-desktop-${{ matrix.label }}
          path: apps/lawmind-desktop/release/*
          if-no-files-found: error

  release:
    needs: package
    if: always() && startsWith(github.ref, 'refs/tags/lawmind-desktop-v') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          pattern: lawmind-desktop-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \
            -o -name '*.tar.gz' -o -name 'latest*.yml' -o -name '*.blockmap' \
          \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer assets found"
            find dist-artifacts -type f | head -100
            exit 1
          fi
          printf 'Attaching %s files\n' "${#files[@]}"
          version="${GITHUB_REF_NAME#lawmind-desktop-}"
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LawMind Desktop ${version}" \
            --notes "$(cat <<EOF
          LawMind 桌面安装包 ${version}。

          - macOS：已用 Developer ID 签名并公证的包可直接双击；未公证的测试包请右键应用选择「打开」。
          - 安装后按向导填写本机模型 API Key。
          - 输出须经执业律师审阅，不构成法律意见。
          EOF
          )"
