# Weekly Electron golden-path E2E (bundled server + packaged renderer).
name: LawMind Electron weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  electron-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter lawmind-desktop exec playwright install chromium --with-deps

      - name: Electron E2E (bundled server + renderer)
        uses: coactions/setup-xvfb@v1

      - name: Run Electron E2E
        run: pnpm lawmind:desktop:e2e:electron
