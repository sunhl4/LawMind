# LawMind-only labeler — paths narrowed to this repo's actual tree.
# (Earlier config referenced OpenClaw/Moltbot trees that no longer exist here.)

"lawmind: engine":
  - changed-files:
      - any-glob-to-any-file:
          - "src/lawmind/**"
          - "scripts/lawmind/**/*.ts"

"lawmind: desktop":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/lawmind-desktop/**"

"lawmind: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "apps/lawmind-docs/**"

"lawmind: scripts":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"

"lawmind: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

"lawmind: security":
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - "src/lawmind/retrieval/authority-*.ts"
          - "src/lawmind/agent/dangerous-tool-policy.ts"
