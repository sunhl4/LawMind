<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>在办 · V2 Inbox vs V3 Ceremony</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #1c1b19; color: #f3efe8;
      font: 15px/1.4 "PingFang SC", sans-serif;
    }
    h1 { margin: 20px 24px 8px; font-size: 20px; }
    .sub { margin: 0 24px 12px; color: #b8aea0; font-size: 13px; }
    .row {
      display: grid;
      grid-template-columns: 1440px 1440px;
      gap: 16px;
      padding: 12px 24px 28px;
      width: 2944px;
    }
    figure {
      margin: 0; width: 1440px; background: #2a2825;
      border-radius: 12px; overflow: hidden;
    }
    figcaption { padding: 12px 14px; font-weight: 700; font-size: 14px; }
    img {
      display: block; width: 1440px; height: 900px;
      object-fit: fill;
    }
  </style>
</head>
<body>
  <h1>LawMind 在办 · 跳出旧壳：V2 Inbox → V3 Ceremony（3×）</h1>
  <p class="sub">左侧仍是侧栏+列表+详情；右侧是 Superhuman/DocuSign 式全屏签批仪式（队列默认隐身）</p>
  <div class="row">
    <figure>
      <figcaption>V2 · Inbox 双栏（仍偏保守）</figcaption>
      <img src="../ui-agents-desk-v2/02-inbox-focus.png" width="1440" height="900" alt="left" />
    </figure>
    <figure>
      <figcaption>V3 · Decision Ceremony（推荐）</figcaption>
      <img src="./01-ceremony-focus.png" width="1440" height="900" alt="ceremony" />
    </figure>
  </div>
</body>
</html>
