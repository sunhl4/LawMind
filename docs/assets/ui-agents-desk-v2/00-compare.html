<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>在办 · 现状 / Decision Inbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #1c1b19;
      color: #f3efe8;
      font: 15px/1.4 "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    h1 { margin: 20px 24px 10px; font-size: 20px; letter-spacing: -0.02em; }
    .row {
      display: grid;
      grid-template-columns: 1440px 1440px;
      gap: 16px;
      padding: 12px 24px 28px;
      width: 2944px;
    }
    figure {
      margin: 0;
      width: 1440px;
      background: #2a2825;
      border-radius: 12px;
      overflow: hidden;
    }
    figcaption { padding: 12px 14px; font-weight: 700; font-size: 14px; }
    img {
      display: block;
      width: 1440px;
      height: 900px;
      object-fit: fill;
      image-rendering: -webkit-optimize-contrast;
    }
  </style>
</head>
<body>
  <h1>LawMind 在办 · 现状问题 vs Decision Inbox 目标（3× Retina）</h1>
  <div class="row">
    <figure>
      <figcaption>现状 · 等权双栏 / 多 Tab</figcaption>
      <img src="./01-current-pain.png" width="1440" height="900" alt="current" />
    </figure>
    <figure>
      <figcaption>目标 · 待我确认 Inbox + Focus Stage</figcaption>
      <img src="./02-inbox-focus.png" width="1440" height="900" alt="target" />
    </figure>
  </div>

</html>
