<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>在办 · 与对话同构</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: #1c1b19;
      color: #1c1915;
    }
    .shell { position: relative; width: 1440px; }
    .badge {
      position: absolute; top: 10px; right: 12px; z-index: 2;
      background: #5c4030; color: #fff; font-size: 11px;
      padding: 4px 8px; border-radius: 6px;
    }
    .frame {
      width: 1440px; height: 900px;
      display: grid;
      grid-template-columns: 240px 1fr;
      background:
        radial-gradient(ellipse 70% 40% at 50% 0%, rgba(166,124,82,0.08), transparent 55%),
        #f4f2ee;
    }
    .side {
      background: #ebe7e0;
      border-right: 1px solid rgba(40,32,22,0.1);
      padding: 16px 12px;
    }
    .side strong { display: block; margin-bottom: 12px; font-size: 15px; }
    .side div { padding: 8px 10px; border-radius: 8px; color: #5c554c; margin-bottom: 4px; }
    .side .on { background: #efe4d4; font-weight: 650; color: #1c1915; }
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .nav {
      display: flex;
      gap: 8px;
      padding: 14px 20px 12px;
      border-bottom: 1px solid rgba(166,124,82,0.28);
      background: linear-gradient(180deg, #f7efe4 0%, #f3ebe0 48%, #efe8df 100%);
    }
    .nav span {
      padding: 6px 14px; border-radius: 999px; color: #6e665c; font-size: 13px;
    }
    .nav .on {
      background: linear-gradient(135deg, #c4a06e, #a67c52);
      color: #fffaf3; font-weight: 700;
    }
    .wb {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #f4f2ee;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(166,124,82,0.28);
      background: linear-gradient(180deg, #f7efe4 0%, #f1e8db 48%, #ebe4d9 100%);
      box-shadow: inset 0 -1px 0 rgba(166,124,82,0.18);
    }
    .bar h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .pill {
      font-size: 12px;
      font-weight: 650;
      color: #8f6a45;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(166,124,82,0.35);
      background: rgba(166,124,82,0.12);
    }
    .split {
      flex: 1;
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      min-height: 0;
    }
    .list {
      border-right: 1px solid rgba(40,32,22,0.1);
      background: #ebe7e0;
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
    }
    .list-head {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8a8278;
      padding: 4px 12px 10px;
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      border: 1px solid transparent;
      color: #1c1915;
    }
    .row.on {
      background: #fffdf9;
      border-color: rgba(166,124,82,0.35);
      box-shadow: 0 1px 2px rgba(40,32,22,0.04);
    }
    .row-st { font-size: 11px; font-weight: 700; color: #8f6a45; }
    .row-st.warn { color: #a16207; }
    .row-st.ok { color: #3f6b4a; }
    .row-t { font-size: 13px; font-weight: 650; line-height: 1.35; }
    .detail {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #f4f2ee;
    }
    .detail-body {
      flex: 1;
      padding: 22px 28px 20px;
      width: min(100%, 36rem);
      max-width: 36rem;
    }
    .kicker {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8a8278;
    }
    .detail-body h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .meta { margin: 0 0 20px; color: #6e665c; font-size: 13px; }
    .block {
      padding: 16px;
      border: 1px solid rgba(40,32,22,0.1);
      border-radius: 10px;
      background: #fffdf9;
      color: #5c554c;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .dock {
      display: flex;
      gap: 8px;
      align-items: center;
      min-height: 56px;
      padding: 10px 28px;
      border-top: 1px solid rgba(166,124,82,0.28);
      background: color-mix(in srgb, #fffdf9 92%, #ebe7e0);
    }
    .primary {
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      color: #fffaf3;
      background: linear-gradient(135deg, #c4a06e, #a67c52 60%, #8a6540);
      box-shadow: 0 6px 16px rgba(166,124,82,0.28);
    }
    .ghost {
      border: 0;
      background: transparent;
      color: #6e665c;
      font-weight: 650;
      padding: 10px 12px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="badge">在办 · 对话同构 · 案卷目录 + 办理区</div>
    <div class="frame">
      <aside class="side">
        <strong>LawMind</strong>
        <div>股权转让纠纷</div>
        <div class="on">劳动争议</div>
        <div>借款合同</div>
      </aside>
      <section class="main">
        <div class="nav">
          <span>对话</span>
          <span class="on">在办</span>
          <span>文书台</span>
        </div>
        <div class="wb">
          <header class="bar">
            <h1>在办</h1>
            <span class="pill">待处理 3</span>
          </header>
          <div class="split">
            <aside class="list">
              <div class="list-head">待我处理</div>
              <div class="row on">
                <span class="row-st">待签批</span>
                <span class="row-t">竞业限制协议 · 修订稿签批</span>
              </div>
              <div class="row">
                <span class="row-st warn">待补充</span>
                <span class="row-t">解除通知书 · 送达地址</span>
              </div>
              <div class="row">
                <span class="row-st ok">待批准</span>
                <span class="row-t">证据目录导出</span>
              </div>
            </aside>
            <section class="detail">
              <div class="detail-body">
                <p class="kicker">待签批</p>
                <h2>竞业限制协议 · 修订稿签批</h2>
                <p class="meta">劳动争议 · 案件 MAT-2026-0142</p>
                <div class="block">
                  对方已回传修订稿。请进入文书台核对红线条款后签批；需要改意见可退回对话继续办理。
                </div>
              </div>
              <footer class="dock">
                <button class="primary" type="button">进入文书台签批</button>
                <button class="ghost" type="button">稍后</button>
                <button class="ghost" type="button">相关对话</button>
              </footer>
            </section>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
